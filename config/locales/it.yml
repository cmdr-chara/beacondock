      c3_all: "Tutti i sistemi operativi"
      c4_h: "La REST API per ogni monitor"
      c4_p: "Crea monitor, leggi i check e interroga lo stato con una chiave API. Le chiavi si vedono una volta sola e sono salvate come digest."
