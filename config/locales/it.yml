      c4_chip: "GET /api/v1/monitors"
    statement:
      type: "Guasti visti prima dei tuoi utenti."
      sub: "BeaconDock te lo dice per primo."
    faq:
      h2: "Domande e risposte."
      q1: "BeaconDock è gratis?"
      a1: "BeaconDock è open source. Lo esegui sulla tua infrastruttura; non c'è un servizio ospitato né un prezzo per monitor."
      q2: "Cosa fa davvero il check di un monitor?"
      a2: "Una richiesta HTTP o HEAD all'URL del monitor, con redirect entro limiti e verifica TLS. Registra codice di stato, latenza ed eventuali errori, poi confronta l'esito con lo stato atteso."
      q3: "Quando si apre l'incidente di un monitor?"
      a3: "Dopo due check falliti consecutivi — la regola anti-flapping. Si risolve automaticamente al primo check riuscito del monitor e mantiene una cronologia completa interrogabile via API."
      q4: "Chi vede la mia status page?"
      a4: "Chiunque abbia il link. L'URL contiene un token ingestibile e compaiono solo i monitor che segnali come pubblici: nomi, hostname, uptime e incidenti."
