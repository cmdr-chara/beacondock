      glance_uptime: "di uptime sui monitor"
      glance_checks: "check eseguiti"
      glance_incidents: "incidenti, risolti da soli"
      q5: "Come si autentica la REST API?"
      a5: "Crei una chiave con nome dalla dashboard; il segreto si vede una volta sola e resta salvato solo come digest. Inviala come Bearer token a /api/v1."
    close:
