      c2_p: "Two failed checks in a row open an incident; the first success resolves it. No flapping alerts at 3 a.m."
      c2_n1_t: "Incident opened — billing.acme.dev"
      c2_n1_b: "2 checks failed · timeout after 5 s"
      c2_n2_t: "Still down — 4 minutes"
      c2_n2_b: "Every 30 s, back-off respected"
      c2_n3_t: "Resolved automatically"
      c2_n3_b: "First 200 OK after 46 s of downtime"
      c3_h: "The public status page per workspace"
      c3_p: "One unguessable link per workspace. Only monitors you mark public appear: hostnames, uptime bars, incident history."
      c3_head: "status.acme.dev"
      c3_all: "All systems operational"
      c4_h: "The REST API for every monitor"
      c4_p: "Create monitors, read checks and query status with an API key. Keys are shown once and stored as digests."
      c4_tab: "api.ts"
      c4_chip: "GET /api/v1/monitors"
    statement:
      type: "Outages seen before your users."
      sub: "BeaconDock tells you first."
    faq:
      h2: "Questions, answered."
      q1: "Is BeaconDock free?"
      a1: "BeaconDock is open source. You run it on your own infrastructure; there is no hosted service and no per-monitor pricing."
      q2: "What does a monitor check do?"
      a2: "An HTTP or HEAD request to the monitor URL, following redirects within bounds, with TLS verification. It records the status code, latency and any error, then compares the result with the expected status."
      q3: "When does a monitor incident open?"
      a3: "After two consecutive failed checks — the anti-flap rule. It resolves automatically on the first successful monitor check and keeps a full history the API can query."
      q4: "Who can see my status page?"
      a4: "Anyone with the link. The URL carries an unguessable token, and only monitors you flag as public appear: names, hostnames, uptime and incidents."
      glance_h: "This month"
      glance_uptime: "uptime across monitors"
      glance_checks: "checks run"
      glance_incidents: "incidents, auto-resolved"
      q5: "How does the REST API authenticate?"
      a5: "You create a named key in the dashboard; the secret is shown once and stored only as a digest. Send it as a Bearer token to /api/v1."
