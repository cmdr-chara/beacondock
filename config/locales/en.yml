      a1: "the core is open: self-host it free. hosted plans come later."
      q2: "what does it check?"
      a2: "HTTP and HTTPS endpoints on a schedule: status code, TLS, latency."
      q3: "what happens on failure?"
      a3: "two consecutive failures open an incident; the first success closes it."
      q4: "where does the data live?"
      a4: "in one sqlite file — checks, incidents and keys stay on your host."
      q5: "can i use it from CI?"
      a5: "yes: every action has a REST endpoint and an API key."
